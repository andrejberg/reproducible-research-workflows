# Software environment of the teaching materials.
# Repo2Docker builds the JupyterLab session from this file. Every package is pinned to an
# exact version, so a rebuild gives the same environment.
name: reproducible-research-workflows
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  # JupyterLab and its extensions
  - jupyterlab=4.6.5
  - jupyterlab-git=0.55.0
  - jupyter-collaboration=5.0.4
  - jupyter-resource-usage=1.3.0
  - ipykernel=7.4.0
  # Data analysis
  - numpy=2.5.4
  - pandas=3.1.0
  - openpyxl=3.1.5
  - matplotlib-base=3.11.2
  - scipy=1.18.1
  - xarray=2026.9.0
